name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: doctor via node
        run: node dist/cli/brain.js doctor
      - name: install the npm package and run its commands
        shell: bash
        run: |
          npm pack
          npm install -g ./reinstall-brain-*.tgz
          reinstall-brain doctor
          reinstall-hub version
      - uses: oven-sh/setup-bun@v2
      - name: standalone binary
        shell: bash
        run: |
          BUN=bun node scripts/compile.mjs
          ./bin/*/reinstall-brain* doctor
